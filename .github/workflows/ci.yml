name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium --only-shell
      - run: python3 scripts/build_release.py --platform macOS
      - run: npm test
      - run: python3 tests/release.py
      - run: node tests/startup-native.cjs .devtools/macos-startup-bridge
      - run: python3 scripts/audit_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-session-stats-macos
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
